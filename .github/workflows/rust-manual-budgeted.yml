# Fork-only CI gate. No push / pull_request / schedule triggers.
# Automatic runs occur only at the CREATION of a ci/<scope>/... branch.
# IMPORTANT: this workflow file MUST be present in the new branch's first
# remote commit. See docs/ci-branch-gates.md before creating a gate branch.
name: Rust checks (branch gates / manual)

on:
  create:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or SHA to check in this fork'
        type: string
        required: true
        default: 'fix/prompt-dsl-postdsl-acceptance-20261108'
      scope:
        description: 'format = fmt; core = check/clippy/lib; full = all features & GUI'
        type: choice
        required: true
        default: format
        options:
          - format
          - core
          - full

# The runner may report only commit status (not push code or edit PRs).
# The token is passed to the final status step only, never to Rust builds.
permissions:
  contents: read
  statuses: write

jobs:
  rust:
    # A create event is emitted for every branch/tag. Only these three prefixes
    # allocate a runner. Explicit manual dispatch remains available.
    if: >-
      ${{
        github.repository == 'ViNonerX/neuromita-rust' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'create' &&
            github.event.ref_type == 'branch' &&
            (
              startsWith(github.event.ref, 'ci/format/') ||
              startsWith(github.event.ref, 'ci/core/') ||
              startsWith(github.event.ref, 'ci/full/')
            )
          )
        )
      }}
    name: "${{ github.event_name == 'create' && github.event.ref || inputs.scope }}"
    # Only accepted gate jobs take the single-run concurrency slot.
    # Unrelated branch/tag creations must never cancel an active check.
    concurrency:
      group: budgeted-rust-gates-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.scope == 'format' || startsWith(github.event.ref, 'ci/format/')) && 8 || (inputs.scope == 'core' || startsWith(github.event.ref, 'ci/core/')) && 25 || 40 }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CHECK_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || startsWith(github.event.ref, 'ci/format/') && 'format' || startsWith(github.event.ref, 'ci/core/') && 'core' || 'full' }}
    steps:
      - name: Checkout exactly the snapshot selected by the trigger
        id: checkout
        uses: actions/checkout@v4
        with:
          # create: immutable SHA from the branch-creation event.
          # manual: explicitly specified fork ref (existing manual behavior).
          ref: ${{ github.event_name == 'create' && github.sha || inputs.target_ref }}
          persist-credentials: false
          fetch-depth: 2

      # On automatic gates, verify that the agent created a CI-only child
      # commit from the ready revision, never a modified source snapshot.
      - name: Verify CI gate is a single workflow-only commit
        id: gate
        if: ${{ github.event_name == 'create' }}
        shell: bash
        run: |
          set -euo pipefail
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [ "$parent_count" != "1" ]; then
            echo "::error::CI gate commit must have exactly one parent"
            exit 1
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [ "$changed" != ".github/workflows/rust-manual-budgeted.yml" ]; then
            echo "::error::Gate commit must change only the CI workflow"
            printf 'Actual changed files: %s\\n' "$changed"
            exit 1
          fi
          echo "READY_SOURCE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          echo "Ready source commit: $(git rev-parse HEAD^)"

      - name: Show source snapshot and check scope
        id: snapshot
        run: |
          echo "Scope: ${CHECK_SCOPE}"
          git log -1 --format='commit: %H%nsubject: %s'
          git status --short

      - name: Install pinned Rust toolchain
        id: toolchain
        # Core uses the crate's declared MSRV. GUI Slint 1.18.1 requires >=1.92.
        env:
          RUST_TOOLCHAIN: ${{ env.CHECK_SCOPE == 'full' && '1.92.0' || '1.89.0' }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Formatting (cheap; fail before compilation)
        id: format
        run: cargo fmt --all -- --check

      - name: Install minimal native dependencies
        id: native
        if: ${{ env.CHECK_SCOPE != 'format' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - name: Install GUI native dependencies
        id: gui_native
        if: ${{ env.CHECK_SCOPE == 'full' }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libudev-dev \
            libfontconfig1-dev

      - name: Core cargo check
        id: core_check
        if: ${{ env.CHECK_SCOPE == 'core' }}
        run: cargo check --locked --offline --all-targets

      - name: Core clippy
        id: core_clippy
        if: ${{ env.CHECK_SCOPE == 'core' }}
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      - name: Core library tests
        id: core_test
        if: ${{ env.CHECK_SCOPE == 'core' }}
        run: cargo test --locked --offline --lib

      - name: Full cargo check (including GUI) (skipped in baseline diagnostic)
        id: full_check
        if: ${{ false }}
        run: cargo check --locked --offline --all-features --all-targets

      - name: Full clippy (including GUI) (skipped in baseline diagnostic)
        id: full_clippy
        if: ${{ false }}
        run: cargo clippy --locked --offline --all-features --all-targets -- -D warnings

      - name: Full PR307 suite with installer diagnostic output
        id: full_test
        if: ${{ env.CHECK_SCOPE == 'full' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/ai_production_installer.rs")
          text=p.read_text(encoding="utf-8")
          before="    let result = fixture.runtime.prepare(&[selected]).await;\n"
          after=before + '    if let Err(error) = &result { eprintln!("BASELINE_INSTALLER_ERROR={error:?}"); } else { eprintln!("BASELINE_INSTALLER_ERROR=Ok"); }\n'
          assert text.count(before) == 1, "diagnostic injection target changed"
          p.write_text(text.replace(before, after), encoding="utf-8")
          PY
          cargo test --locked --offline --all-features --all-targets -- --nocapture

      # GitHub connector can read commit statuses but cannot list create-event
      # workflow runs. A status with target_url gives it the run ID for job logs.
      # This runs on the SAME runner, with no extra job, cache or artifact.
      - name: Publish searchable result for agents
        id: report
        if: ${{ always() }}
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          GH_JOB_STATUS: ${{ job.status }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEP_OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }};
            gate=${{ steps.gate.outcome }};
            snapshot=${{ steps.snapshot.outcome }};
            toolchain=${{ steps.toolchain.outcome }};
            format=${{ steps.format.outcome }};
            native=${{ steps.native.outcome }};
            gui-native=${{ steps.gui_native.outcome }};
            core-check=${{ steps.core_check.outcome }};
            core-clippy=${{ steps.core_clippy.outcome }};
            core-test=${{ steps.core_test.outcome }};
            full-check=${{ steps.full_check.outcome }};
            full-clippy=${{ steps.full_clippy.outcome }};
            full-test=${{ steps.full_test.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          raw = os.environ["STEP_OUTCOMES"]
          stages = [part.strip().split("=", 1) for part in raw.split(";") if "=" in part]
          failed_stage = next((name for name, outcome in stages if outcome == "failure"), None)
          job_status = os.environ["GH_JOB_STATUS"]
          state = "success" if job_status == "success" else "failure"
          detail = failed_stage or ("all checks passed" if state == "success" else job_status)
          scope = os.environ["CHECK_SCOPE"]
          run_url = os.environ["CI_RUN_URL"]
          description = f"{state}: {detail} ({scope})"[:140]
          context = f"ci/gate/{scope}"

          def rev_parse(revision):
              try:
                  return subprocess.check_output(
                      ["git", "rev-parse", "--verify", revision],
                      text=True, stderr=subprocess.DEVNULL,
                  ).strip()
              except (OSError, subprocess.CalledProcessError):
                  return None

          # Post to gate SHA and, for automatic gates, to the original source
          # SHA. Both are readable by the existing GitHub commit-status tool.
          shas = [rev_parse("HEAD") or os.environ["GITHUB_SHA"]]
          if os.environ["GITHUB_EVENT_NAME"] == "create":
              parent = rev_parse("HEAD^")
              if parent and parent not in shas:
                  shas.append(parent)

          payload = {
              "state": state,
              "context": context,
              "description": description,
              "target_url": run_url,
          }
          token = os.environ["GH_STATUS_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          for sha in shas:
              url = f"https://api.github.com/repos/{repository}/statuses/{sha}"
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Published {context} {state} to {sha}: HTTP {response.status}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as file:
                  file.write(
                      f"### {context}: {state}\n\n"
                      f"- Source commit: `{shas[-1]}`\n"
                      f"- First failed stage: `{detail}`\n"
                      f"- [Complete job log]({run_url})\n"
                  )
          PY
